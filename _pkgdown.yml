url: https://anhsmith.github.io/skellambrms/

template:
  bootstrap: 5

reference:
- title: Difference families
  desc: >
    Model the difference `d = y1 - y2` directly. The `1` variants fix the
    location at zero (do the two sources agree on average?); the `2` variants
    estimate it (by how much do they disagree?).
  contents:
  - skellam1
  - skellam2
  - dnorm1
  - dnorm2
  - dlaplace1
  - dlaplace2

- title: Truncation support
  desc: >
    Stan `lccdf` functions injected as stanvars so each family normalises
    correctly under `resp_trunc()`.
  contents:
  - skellam1_lccdf_stanvars
  - skellam2_lccdf_stanvars
  - dnorm1_lccdf_stanvars
  - dnorm2_lccdf_stanvars
  - dlaplace1_lccdf_stanvars
  - dlaplace2_lccdf_stanvars

- title: Parameterisation helpers
  desc: >
    Read a fitted family's dpars under the names its documentation uses.
  contents:
  - skellam2_dpars
